[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-search-service"
version = "0.1.0"
description = "Enterprise hybrid search: BM25 + dense vectors + Reciprocal Rank Fusion + reranking"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "pydantic"]

[tool.setuptools]
packages = ["enterprise_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
