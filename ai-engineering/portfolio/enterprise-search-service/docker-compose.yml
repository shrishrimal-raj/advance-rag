services:
  search:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SEARCH_TOP_K=${SEARCH_TOP_K:-3}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
