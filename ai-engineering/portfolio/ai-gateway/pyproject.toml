[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gateway"
version = "0.1.0"
description = "The AI Gateway: streaming, non-blocking chat backend with real-time token usage and cost tracking"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "pydantic"]

[tool.setuptools]
packages = ["ai_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
