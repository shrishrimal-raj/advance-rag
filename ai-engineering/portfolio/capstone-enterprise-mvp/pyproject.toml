[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone"
version = "0.1.0"
description = "The Capstone: full-stack AI application - multi-agent LangGraph-style backend, RAG pipeline, streaming UI, CI/CD"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "pydantic"]

[tool.setuptools]
packages = ["capstone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
