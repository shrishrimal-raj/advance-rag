[project]
name = "rag-evaluation-harness"
version = "0.1.0"
description = "Standalone RAG evaluation & MLOps harness: custom offline metrics, A/B pipeline comparison, regression gate"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "ragas>=0.2",
    "datasets>=2.19",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pytest>=8.0",
]

[tool.uv]
package = false
