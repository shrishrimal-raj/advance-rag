name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests (must pass offline — no LLM calls)
        run: uv run pytest -v
        # Non-zero exit from pytest fails the build automatically.
